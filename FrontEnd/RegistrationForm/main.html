<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>

<body>
    <header>
        <h2>Student Registration Form</h2>
        <p>Please fill out the form below to register.</p>
    </header>
    
    <main></main>
    
    <hr>
    <fieldset>
        <legend>Personal Information</legend> 
        
        <label for="name">First Name:</label>
        <input type="text" required>
        
        <br>
        <br>
        
        <label for="name">Last Name:</label>
        <input type="text"required>
        
        <br>
        <br>
        
        <label for="DOB"> Date of birth:</label>
        <input type="date" id="DOB" name="DOB" required>

        <br>
        <br>
        <label for="gender">Gender:</label>
        <input type="checkbox"  value="male"/>Male
        <input type="checkbox" value="female"/>Female
        <input type="checkbox" value="other"/>Other
        
        <br>
        <br>
        <label for="Email">Email:</label>
        <input type="email" required>
        <br>
        <br>
        <label for=number>Phone:</label>
        <input type="number"required>
        <br>
        <br>
    </fieldset>
    <hr>
    <fieldset>
        <legend>Address Information</legend> 

        <label for="address">Address:</label> <br>
        <textarea type="address"></textarea>

        <br>
        <br>
        
        <label for="text">City:</label>
        <input type="text"required>
        
        <br>
        <br>
        
        <label for="text"> State</label>
        <input type="text" required>

        <br>
        <br>
        <label for=number>ZIP Code:</label>
        <input type="number"required>
        <br>
        <br>
    </fieldset>

    <hr>
    <fieldset>
        <legend>Educational Information</legend> 
        
        <label for="text">High School:</label>
        <input type="text" required>
        
        <br>
        <br>
        <label for="number">GPA:</label>
        <input type="number"required>
        
        <br>
        <br>
        <label for="text">Intended Major:</label>
        <input type="text"required>
        
        <br>
        <br>
        
        <label for="number"> Year of Graduation</label>
        <input type="number" required>
        <br>
        <br>
    </fieldset>

    <fieldset>
        <legend>Additional Information</legend> 

        
        <label for="text">Interests and Hobbies:</label> <br>
        <textarea type="text"></textarea>

        <br>

        <label for="text">Additional Comments:</label> <br>
        <textarea type="text"></textarea>
        <hr>
    </fieldset>
    <br>

    <button type="button">Register</button>
    <hr>
    
    <footer> <p>C 2024 Student Registration. All rights reserved</p></footer>
</body>
</html>
